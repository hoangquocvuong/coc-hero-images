name: Update Hero Images

on:
  schedule:
    - cron: "30 0 * * 0"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repair Missing Hero Images
        run: node repair-missing-images.js

      - name: Repair Alias Hero Images
        run: |
          if [ -f repair-alias-images.js ]; then
            node repair-alias-images.js
          fi

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git diff --cached --quiet || git commit -m "Auto update hero images"

          git push
